<style>
:root{--bg:#06090e;--bg2:#0a0f16;--panel:#0c121b;--line:#1b2533;--line2:#243246;--txt:#e6edf6;--mut:#7d8ba1;--dim:#4b5869;--acc:#3ee0a8;--acc2:#4cc3ff;--warn:#f5b84a;--bad:#ff5f73;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

header{display:flex;align-items:center;gap:10px;padding:4px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:12px}

.hr{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.lsw{display:flex;border:1px solid var(--line2);font-family:var(--mono);font-size:11px;font-weight:700;position:relative}
.lsw span{position:relative;z-index:1;padding:5px 8px;color:var(--mut);transition:color .3s;cursor:pointer}

.intro b{color:var(--txt)}

.chip.on{border-color:var(--acc);color:var(--txt);background:rgba(62,224,168,.08)}.chip.on .ct{color:var(--acc)}

.card::before{top:-1px;left:-1px;border-width:1px 0 0 1px}.card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}

.ch{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.4px;text-transform:uppercase}
.ch .r{margin-left:auto;color:var(--txt)}
.ch .lk{color:var(--warn)}.xl{cursor:pointer;text-decoration:underline dotted rgba(62,224,168,.5);text-underline-offset:3px}.xh{display:flex;align-items:center;gap:12px;margin:4px 0 6px}.xh img{width:46px;height:46px;object-fit:contain;background:var(--bg2);border:1px solid var(--line2);padding:5px}.xh b{display:block;font-size:18px;line-height:1.2}.xh small{display:block;font:11px var(--mono);color:var(--mut);margin-top:3px}.of{font-size:12px;color:var(--mut);font-weight:500}.xrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}.xnote{font-size:12px;color:var(--mut);line-height:1.55;padding:6px 0}.fps{display:inline-flex;gap:3px}.fp{display:inline-grid;place-items:center;width:18px;height:18px;font:700 10px var(--mono);font-style:normal;color:#03110b}.fp.w{background:var(--acc)}.fp.d{background:#7d8ba1}.fp.l{background:var(--bad)}.xfx{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.xfx .t{font:10.5px var(--mono);color:var(--mut)}.xfx small{display:block;font-size:10.5px;color:var(--mut)}.xfx b{font-family:var(--mono);color:var(--txt)}.xt td{padding:6px 3px}.xt .tn{display:flex;align-items:center;gap:6px}.xt .tn img{width:16px;height:16px;object-fit:contain}.xt tr.hl td{background:rgba(62,224,168,.08)}.xt tr.hl .tn{color:var(--acc);font-weight:700}.xt .fps .fp{width:13px;height:13px;font-size:8px}.tz{text-align:left;margin:18px 0 8px}.tzh{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:9px;border-bottom:1px dashed var(--line2)}.tzh b{display:block;font:700 13px var(--mono);letter-spacing:2px;color:var(--acc)}.tzh small{display:block;font-size:11.5px;color:var(--mut);margin-top:3px}.tzk{font-size:16px}.tzl{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;opacity:0;animation:fadeUp .4s forwards}.tzl .t{font:11px var(--mono);color:var(--mut)}.tzl small{display:block;font-size:11px;color:var(--mut)}.tzb{filter:blur(4.5px);user-select:none}.tzlk{font:600 11px var(--mono);color:var(--warn);border:1px solid rgba(245,184,74,.35);padding:2px 6px}.tzm{font:600 11.5px var(--mono);color:var(--acc2);padding:9px 0 2px}.tzr{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line2);font-size:12.5px}.tzr span{display:block;font:600 10.5px var(--mono);letter-spacing:1px;color:var(--dim);text-transform:uppercase;margin-bottom:4px}.tzr div{padding:3px 0}.tzr small{color:var(--mut)}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:5px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.lv{color:var(--bad);font-weight:700}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0}
.tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:13.5px;font-weight:600;line-height:1.2}

.crest{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--bg2);position:relative}
